<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo PPC- Curso - xPPC</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/Dados_curso.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TOPO -->
    <header class="topo">
        <div class="topo-esquerda">
            <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
            <div class="linha-vertical"></div>
            <h1>Sistema de Criação e Automatização de PPC</h1>
        </div>

        <div class="topo-direita">
            <img src="../assets/moon.png" alt="Modo escuro" class="icone-tema">

            <button class="switch-tema" type="button">
                <img src="../assets/vector.png" alt="Alternar tema" class="switch-fundo">
                <span class="switch-bolinha"></span>
            </button>

            <img src="../assets/sun.png" alt="Modo claro" class="icone-tema">
        </div>
    </header>

    <!-- ÁREA GERAL -->
    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">
            <nav>
                <a href="/frontend/pages/paginaInicial.html" class="item-menu">
                    <span>Página Inicial</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/NovoPPc.html" class="item-menu ativo">
                    <span>Novo PPC</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcCad.html" class="item-menu">
                    <span>PPCs cadastrados</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcAndamento.html" class="item-menu">
                    <span>PPCs em andamento</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/ajuda.html" class="item-menu">
                    <span>Ajuda</span>
                    <img src="../assets/arrow.png" alt="">
                </a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo-novo-ppc">

            <!-- CAMINHO -->
            <div class="breadcrumb">
                <img src="../assets/button.png" alt="Página inicial">
                <span>›</span>
                <span>Página Inicial</span>
                <span>›</span>
                <span>Novo PPC</span>
                <span>›</span>
                <span>Novo PPC - Curso</span>
                <span>›</span>
                <span>Novo PPC - Curso - informações</span>
            </div>

            <form class="formulario form-novo-ppc">

                <div class="grade-formulario">

                    <div class="grupo-campo">
                        <label>Regime <span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o regime do curso">
                    </div>

                    <div class="grupo-campo">
                        <label>Turnos <span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe quantos turnos o curso é oferecido">
                    </div>

                    <div class="grupo-campo">
                        <label>Número de turmas por turno de oferta<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o número de turmas por turno de oferta">
                    </div>

                    <div class="grupo-campo">
                        <label>Vagas por turma<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o número de vagas por turma">
                    </div>

                    <div class="grupo-campo">
                        <label>Número de vagas por turno de oferta<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o número de vagas por turno de oferta">
                    </div>
                    <div class="grupo-campo">
                        <label>Vagas por semestre<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o número de vagas por semestre">
                    </div>

                    <div class="grupo-campo campo-inteiro">
                        <label>Duração do Curso <span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe a duração do curso">
                    </div>

                    <div class="grupo-campo">
                        <label>Conceito de Curso (CC)<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o conceito de curso (CC)">
                    </div>
                    <div class="grupo-campo">
                        <label>Conceito Preliminar de Curso (CPC)<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o conceito preliminar de curso (CPC)">
                    </div>

                    <div class="grupo-campo">
                        <label>Conceito Enade<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o conceito do Enade">
                    </div>
                    <div class="grupo-campo">
                        <label>Indice Geral de Cursos (IGC)<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o índice geral de cursos (IGC)">
                    </div>

                    <div class="grupo-campo">
                        <label>Situação do Curso<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe a situação do curso">
                    </div>
                    <div class="grupo-campo">
                        <label>Status do Curso<span class="obrigatorio">*</span></label>
                        <input type="text" placeholder="Informe o status do curso">
                    </div>

                </div>

                <div class="acoes-formulario">
                    <button type="button" class="botao-cancelar">Cancelar</button>

                    <div class="acoes-direita">
                        <button type="button" class="botao-rascunho">Salvar rascunho</button>
                        <a href="/frontend/pages/NovoPPcComponentes.html" class="botao-proximo">Próximo</a>
                    </div>
                </div>

            </form>

        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/ppc-form.js"></script>
    <script src="../js/utils.js"></script>
</body>

</html>
