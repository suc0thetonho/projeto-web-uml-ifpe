<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo PPC- Curso - xPPC</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/Dados_curso.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- TOPO -->
    <header class="topo">
        <div class="topo-esquerda">
            <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
            <div class="linha-vertical"></div>
            <h1>Sistema de Criação e Automatização de PPC</h1>
        </div>

        <div class="topo-direita">
            <img src="../assets/Moon.png" alt="Modo escuro" class="icone-tema">

            <button class="switch-tema" type="button">
                <img src="../assets/Vector.png" alt="Alternar tema" class="switch-fundo">
                <span class="switch-bolinha"></span>
            </button>

            <img src="../assets/Sun.png" alt="Modo claro" class="icone-tema">
        </div>
    </header>

    <!-- ÁREA GERAL -->
    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">
            <nav>
                <a href="/frontend/pages/paginaInicial.html" class="item-menu">
                    <span>Página Inicial</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/NovoPPc.html?novo=1" class="item-menu ativo">
                    <span>Novo PPC</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcCad.html" class="item-menu">
                    <span>PPCs cadastrados</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcAndamento.html" class="item-menu">
                    <span>PPCs em andamento</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/ajuda.html" class="item-menu">
                    <span>Ajuda</span>
                    <img src="../assets/arrow.png" alt="">
                </a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo-novo-ppc">

            <!-- CAMINHO -->
            <div class="breadcrumb">
                <img src="../assets/button.png" alt="Página inicial">
                <span>›</span>
                <span>Página Inicial</span>
                <span>›</span>
                <span>Novo PPC</span>
                <span>›</span>
                <span>Novo PPC - Curso</span>
                <span>›</span>
                <span>Novo PPC - Curso - informações</span>
            </div>

            <form class="formulario form-novo-ppc" id="form-curso2">

                <div class="grade-formulario">

                    <div class="grupo-campo">
                        <label>Regime <span class="obrigatorio">*</span></label>
                        <select name="regime">
                            <option value="">Selecione o regime</option>
                            <option value="Integral">Integral</option>
                            <option value="Parcial">Parcial</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label>Turnos <span class="obrigatorio">*</span></label>
                        <input type="text" name="turnos" placeholder="Informe quantos turnos o curso é oferecido">
                    </div>

                    <div class="grupo-campo">
                        <label>Número de turmas por turno de oferta<span class="obrigatorio">*</span></label>
                        <input type="text" name="num_turmas_por_turno" placeholder="Nº de turmas por turno">
                    </div>

                    <div class="grupo-campo">
                        <label>Vagas por turma<span class="obrigatorio">*</span></label>
                        <input type="text" name="vagas_por_turma" placeholder="Nº de vagas por turma">
                    </div>

                    <div class="grupo-campo">
                        <label>Número de vagas por turno de oferta<span class="obrigatorio">*</span></label>
                        <input type="text" name="num_vagas_por_turno" placeholder="Nº de vagas por turno">
                    </div>
                    <div class="grupo-campo">
                        <label>Vagas por semestre<span class="obrigatorio">*</span></label>
                        <input type="text" name="vagas_por_semestre" placeholder="Nº de vagas por semestre">
                    </div>

                    <div class="grupo-campo campo-inteiro">
                        <label>Duração do Curso <span class="obrigatorio">*</span></label>
                        <input type="text" name="duracao_curso" placeholder="Informe a duração do curso">
                    </div>

                    <div class="grupo-campo">
                        <label>Conceito de Curso (CC)<span class="obrigatorio">*</span></label>
                        <input type="text" name="conceito_curso" placeholder="Conceito de curso (CC)">
                    </div>
                    <div class="grupo-campo">
                        <label>Conceito Preliminar de Curso (CPC)<span class="obrigatorio">*</span></label>
                        <input type="text" name="conceito_preliminar_curso" placeholder="Conceito preliminar (CPC)">
                    </div>

                    <div class="grupo-campo">
                        <label>Conceito Enade<span class="obrigatorio">*</span></label>
                        <input type="text" name="conceito_enade" placeholder="Conceito Enade">
                    </div>
                    <div class="grupo-campo">
                        <label>Índice Geral de Cursos (IGC)<span class="obrigatorio">*</span></label>
                        <input type="text" name="igc" placeholder="Índice Geral de Cursos (IGC)">
                    </div>

                    <div class="grupo-campo">
                        <label>Situação do Curso <span class="obrigatorio">*</span></label>
                        <select name="situacao_curso">
                            <option value="">Selecione a situação do curso</option>
                            <option value="Apresentação inicial do PPC">Apresentação inicial do PPC</option>
                            <option value="Reformulação integral do PPC">Reformulação integral do PPC</option>
                            <option value="Reformulação Parcial do PPC">Reformulação Parcial do PPC</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label>Status do Curso <span class="obrigatorio">*</span></label>
                        <select name="status_curso">
                            <option value="">Selecione o status do curso</option>
                            <option value="Aguardando autorização do conselho superior">Aguardando autorização do conselho superior</option>
                            <option value="Autorizado pelo conselho superior">Autorizado pelo conselho superior</option>
                            <option value="Aguardando reconhecimento do MEC">Aguardando reconhecimento do MEC</option>
                            <option value="Reconhecido pelo MEC">Reconhecido pelo MEC</option>
                            <option value="Cadastrado no SISTEC">Cadastrado no SISTEC</option>
                        </select>
                    </div>

                </div>

                <div class="acoes-formulario">
                    <button type="button" class="botao-cancelar">Cancelar</button>

                    <div class="acoes-direita">
                        <button type="button" class="botao-rascunho">Salvar rascunho</button>
                        <button type="button" class="botao-proximo">Próximo</button>
                    </div>
                </div>

            </form>


        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../js/camposRegras.js"></script>
    <script src="../js/novoPpc.js"></script>
</body>
</html>
