<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha</title>
    <link rel="stylesheet" href="/frontend/css/base.css">
    <link rel="stylesheet" href="/frontend/css/senhaAlt.css">
</head>
<body>
    <main class="pagina">
        <section class="card-esquerdo"> 
            <div class="area-imagem">
                <img src="/frontend/assets/ConfEmail.png" alt="PPC" class="imagem tela-senha">
            </div>
        </section>
    
        <section class="card-formulario">
            <form class="formulario">
                <a href="/frontend/pages/login.html" class="voltar-login">← Voltar para o login</a>
                <h2 class="titulo-acesso">Esqueceu a Senha</h2>
                <p class="descricao">Digite seu e-mail cadastrado.</p>
                <input type="email" placeholder="E-mail Cadastrado">
                <div class="aviso">
                    ℹ Email para receber código de acesso
                </div>
                <button type="button" class="botao">Continuar</button>
            </form>
            <div class="rodape-card">
                <img src="/frontend/assets/ifpe.png" alt="IFPE" class="logo-ifpe">
                <a href="/frontend/pages/contatos.html" class="ajuda">precisa de ajuda?</a>
            </div>
            
        </section>
    </main>
    <script src="/frontend/js/esqueceuSenha.js" defer></script>
</body>
</html>
