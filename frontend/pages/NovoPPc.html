<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo PPC - xPPC</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/Dados_curso.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- TOPO -->
    <header class="topo">
        <div class="topo-esquerda">
            <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
            <div class="linha-vertical"></div>
            <h1>Sistema de Criação e Automatização de PPC</h1>
        </div>

        <div class="topo-direita">
            <img src="../assets/Moon.png" alt="Modo escuro" class="icone-tema">

            <button class="switch-tema" type="button">
                <img src="../assets/Vector.png" alt="Alternar tema" class="switch-fundo">
                <span class="switch-bolinha"></span>
            </button>

            <img src="../assets/Sun.png" alt="Modo claro" class="icone-tema">
        </div>
    </header>

    <!-- ÁREA GERAL -->
    <div class="layout">

        <!-- MENU LATERAL -->
        <aside class="menu-lateral">
            <nav>
                <a href="/frontend/pages/paginaInicial.html" class="item-menu">
                    <span>Página Inicial</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/NovoPPc.html?novo=1" class="item-menu ativo">
                    <span>Novo PPC</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcCad.html" class="item-menu">
                    <span>PPCs cadastrados</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/PPcAndamento.html" class="item-menu">
                    <span>PPCs em andamento</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="/frontend/pages/ajuda.html" class="item-menu">
                    <span>Ajuda</span>
                    <img src="../assets/arrow.png" alt="">
                </a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo-novo-ppc">

            <!-- CAMINHO -->
            <div class="breadcrumb">
                <img src="../assets/button.png" alt="Página inicial">
                <span>›</span>
                <span>Página Inicial</span>
                <span>›</span>
                <span>Novo PPC</span>
            </div>

            <!-- TÍTULO -->
            <section class="cabecalho-novo-ppc">
                <h2>Novo PPC - Dados do curso</h2>
                <p>
                   Preencha as informações abaixo para da inicio a o processo de criação de um novo PPC.
                </p>
            </section>

            <form class="formulario form-novo-ppc" id="form-campus">

                <div class="grade-formulario">

                    <div class="grupo-campo campo-inteiro">
                        <label>Nome do Campus <span class="obrigatorio">*</span></label>
                        <input type="text" name="nome_campus" placeholder="Informe o nome do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>CNPJ <span class="obrigatorio">*</span></label>
                        <input type="text" name="cnpj" placeholder="Informe o CNPJ do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>Cidade <span class="obrigatorio">*</span></label>
                        <input type="text" name="cidade_campus" placeholder="Informe a cidade do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>CEP <span class="obrigatorio">*</span></label>
                        <input type="text" name="cep" placeholder="Informe o CEP do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>Bairro <span class="obrigatorio">*</span></label>
                        <input type="text" name="bairro" placeholder="Informe o bairro do campus">
                    </div>

                    <div class="linha-rua-numero">
                        <div class="grupo-campo">
                            <label>Rua <span class="obrigatorio">*</span></label>
                            <input type="text" name="rua" placeholder="Informe a rua do campus">
                        </div>

                        <div class="grupo-campo">
                            <label>Número <span class="obrigatorio">*</span></label>
                            <input type="text" name="numero" placeholder="Informe o número do campus">
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label>Telefone/Fax <span class="obrigatorio">*</span></label>
                        <input type="text" name="telefone_fax" placeholder="Informe o telefone/fax do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>E-mail de contato <span class="obrigatorio">*</span></label>
                        <input type="email" name="email_contato" placeholder="Informe o e-mail de contato do campus">
                    </div>

                    <div class="grupo-campo">
                        <label>Ato Legal de Criação <span class="obrigatorio">*</span></label>
                        <input type="text" name="ato_legal" placeholder="Informe o ato legal de criação do curso">
                    </div>

                    <div class="grupo-campo">
                        <label>Sítio <span class="obrigatorio">*</span></label>
                        <input type="text" name="sitio" placeholder="Informe o sítio do campus">
                    </div>

                </div>

                <div class="acoes-formulario">
                    <button type="button" class="botao-cancelar">Cancelar</button>

                    <div class="acoes-direita">
                        <button type="button" class="botao-proximo">Próximo</button>
                    </div>
                </div>

            </form>


        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../js/camposRegras.js"></script>
    <script src="../js/novoPpc.js"></script>
</body>
</html>
