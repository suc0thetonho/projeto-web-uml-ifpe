<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPCs cadastrados</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/ppcs-cadastrados.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topo">
        <div class="topo-esquerda">
            <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
            <div class="linha-vertical"></div>
            <h1>Sistema de Criação e Automatização de PPC</h1>
        </div>

        <div class="topo-direita">
            <img src="../assets/Moon.png" alt="Tema escuro" class="icone-tema">

            <button class="switch-tema" type="button">
                <img src="../assets/Vector.png" alt="Alternar tema" class="switch-fundo">
                <span class="switch-bolinha"></span>
            </button>

            <img src="../assets/Sun.png" alt="Tema claro" class="icone-tema">
        </div>
    </header>

    <div class="layout">

        <aside class="menu-lateral">
            <nav>
                <a href="./paginainicial.html" class="item-menu">
                    <span>Página Inicial</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="./NovoPPc.html" class="item-menu">
                    <span>Novo PPC</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="./PPcCad.html" class="item-menu ativo">
                    <span>PPCs cadastrados</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="./PPcAndamento.html" class="item-menu">
                    <span>PPCs em andamento</span>
                    <img src="../assets/arrow.png" alt="">
                </a>

                <a href="./ajuda.html" class="item-menu">
                    <span>Ajuda</span>
                    <img src="../assets/arrow.png" alt="">
                </a>
            </nav>
        </aside>

        <main class="conteudo ppcs-page">

            <div class="breadcrumb">
                <img src="../assets/button.png" alt="Início">
                <span>›</span>
                <span>Página inicial</span>
                <span>›</span>
                <span>PPCs cadastrados</span>
            </div>

            <section class="cabecalho-ppcs">
                <h2>PPCs cadastrados</h2>
                <p>Nesta página você encontra os documentos que já foram gerados.</p>
            </section>

            <section class="barra-busca">
                <input type="text" id="buscarDocumento" placeholder="Buscar por Documento">
            </section>

            <section class="card-tabela">
    <table id="tabela-ppcs" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: #f8f9fa;">
                <th style="padding: 12px; border-bottom: 2px solid #dee2e6;">Documento</th>
                <th style="padding: 12px; border-bottom: 2px solid #dee2e6;">Data de envio</th>
                <th style="padding: 12px; border-bottom: 2px solid #dee2e6;">Status</th>
            </tr>
        </thead>
        <tbody id="tabelaPpcs">
            </tbody>
    </table>
</section>

        </main>

    </div>
 <script type="module" src="../../src/pages/PPcCad.js"></script>
</body>
</html>
