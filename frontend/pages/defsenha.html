<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Senha</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/defsenha.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="pagina">
        <section class="card-esquerdo senha-esquerda">
            <div class="area-imagem">
                <img src="../assets/senhaD.png" alt="imagem definir senha" class="imagem-senha">
            </div>
        </section>

        <section class="card-senha">
            <a href="../../index.html" class="voltar-menu">← Voltar para Menu</a>
            <form id="form-defsenha" class="formulario-senha">
                <h1>Defina sua senha</h1>
                <div class="grupo-campo">
                    <label for="senha">Senha</label>
                    <div class="campo-input">
                        <img src="../assets/Primary.png" alt="Cadeado" class="icone-campo">
                        <input type="password" id="senha" placeholder="Senha" required>
                        <img src="../assets/icon.png" alt="" class="icone-olho">
                    </div>
                </div>
                <div class="grupo-campo">
                    <label>Confirmar Senha</label>
                    <div class="campo-input">
                        <img src="../assets/Primary.png" alt="Cadeado" class="icone-campo">
                        <input type="password" id="confirmar-senha" placeholder="Confirmar Senha" required>
                        <img src="../assets/icon.png" alt="" class="icone-olho">
                    </div>
                </div>
                
                <div id="mensagem-aviso" style="margin-top: 10px; font-size: 14px; text-align: center;"></div>

                <button type="submit" class="botao">Finalizar</button>
            </form>
            <div class="rodape-card">
                <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
                <a href="../pages/contatos.html" class="ajuda">precisa de ajuda?</a>
            </div>
        </section>
        
    </main>

    <script type="module" src="../../src/pages/defsenha.js"></script>
</body>
</html>
