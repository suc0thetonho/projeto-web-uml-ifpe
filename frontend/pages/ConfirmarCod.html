<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Código</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/ConfEmail.css">
</head>
<body>
    <main class="pagina">
        <section class="card-esquerdo"> 
            <div class="area-imagem">
                <img src="../assets/confEmail.png" alt="Confirmar Email" class="imagem tela-senha">
            </div>
        </section>
    
        <section class="card-formulario">
            <form id="form-confirmar-codigo" class="formulario">
                <h2 class="titulo-acesso">Confirmar Código</h2>
                
                
                <p class="descricao">Código</p>
                <input type="text" id="input-codigo" placeholder="Digite o código" required>
                
                <div class="aviso">
                    ℹ Verifique sua caixa de entrada
                </div>

                <a href="../pages/esqueceuSenha.html" class="botao-editar">Editar e-mail</a>
                
                <button type="button" id="btn-verificar" class="verificar-codigo">Verificar código</button>
            </form>
            
            <div class="rodape-card">
                <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
                <a href="./contatos.html" class="ajuda">precisa de ajuda?</a>
            </div>
        </section>
    </main>
    <script type="module" src="../../src/pages/confirmarCod.js"></script>
</body>
</html>
