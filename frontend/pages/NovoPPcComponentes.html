<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo PPC - Componentes - xPPC</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/Dados_curso.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topo">
        <div class="topo-esquerda">
            <img src="../assets/ifpe.png" alt="IFPE" class="logo-ifpe">
            <div class="linha-vertical"></div>
            <h1>Sistema de Criação e Automatização de PPC</h1>
        </div>
        <div class="topo-direita">
            <img src="../assets/moon.png" alt="Modo escuro" class="icone-tema">
            <button class="switch-tema" type="button"><span class="switch-bolinha"></span></button>
            <img src="../assets/sun.png" alt="Modo claro" class="icone-tema">
        </div>
    </header>

    <div class="layout">
        <aside class="menu-lateral">
            <nav>
                <a href="./paginainicial.html" class="item-menu"><span>Página Inicial</span></a>
                <a href="./NovoPPc.html" class="item-menu ativo"><span>Novo PPC</span></a>
                <a href="./PPcCad.html" class="item-menu"><span>PPCs cadastrados</span></a>
                <a href="./PPcAndamento.html" class="item-menu"><span>PPCs em andamento</span></a>
                <a href="./ajuda.html" class="item-menu"><span>Ajuda</span></a>
            </nav>
        </aside>

        <main class="conteudo conteudo-novo-ppc">
            <div class="breadcrumb">
                <img src="../assets/button.png" alt="Início"> <span>›</span> <span>Página inicial</span> <span>›</span> <span>Novo PPC</span> <span>›</span> <span>Componentes Curriculares</span>
            </div>

            <section class="cabecalho-novo-ppc">
                <h1>Novo PPC - Informações dos Componentes Curriculares</h1>
            </section>

            <form id="form-componentes" class="formulario form-novo-ppc">
                <div class="grade-formulario">
                    <div class="grupo-campo"><label>Código *</label><input type="text" id="comp-codigo" placeholder="Digite o código" required></div>
                    <div class="grupo-campo"><label>Nome *</label><input type="text" id="comp-nome" placeholder="Digite o nome" required></div>
                    
                    <div class="linha-tres-campos">
                        <div class="grupo-campo"><label>Créd. Práticos *</label><input type="text" id="comp-credPrat"></div>
                        <div class="grupo-campo"><label>Créd. Teóricos *</label><input type="text" id="comp-credTeor"></div>
                        <div class="grupo-campo"><label>Créd. Extensão *</label><input type="text" id="comp-credExt"></div>
                    </div>

                    <div class="grupo-campo"><label>Total Horas Práticas *</label><input type="text" id="comp-horasPrat"></div>
                    <div class="grupo-campo"><label>Total Horas Teóricas *</label><input type="text" id="comp-horasTeor"></div>
                    
                    <div class="linha-tres-campos">
                        <div class="grupo-campo"><label>Total Horas Extensão *</label><input type="text" id="comp-horasExt"></div>
                        <div class="grupo-campo"><label>Tipo *</label><input type="text" id="comp-tipo"></div>
                        <div class="grupo-campo"><label>Período *</label><input type="text" id="comp-periodo"></div>
                    </div>

                    <div class="grupo-campo"><label>Pré-requisitos *</label><input type="text" id="comp-pre"></div>
                    <div class="grupo-campo"><label>Correquisitos *</label><input type="text" id="comp-correq"></div>
                </div>

                <button type="button" id="btn-adicionar" class="botao-proximo">Adicionar à Tabela</button>

                <section class="tabela-componentes" style="margin-top: 20px;">
                    <table id="tabela-componentes" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #d4edda;">
                                <th>Código</th><th>Nome</th><th>Tipo</th><th>Período</th><th>Créditos</th><th>Total Horas</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>

                <div class="acoes-formulario">
                    <button type="button" class="botao-cancelar" onclick="window.location.href='./paginainicial.html'">Cancelar</button>
                    <button type="submit" class="botao-gerar">Gerar Documento</button>
                </div>
            </form>
        </main>
    </div>
    <script type="module" src="../../src/pages/NovoPPcComponentes.js"></script>
</body>
</html>
